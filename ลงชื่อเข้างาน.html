@keyframes catPop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}

.gs-err{background:#FFDDD9;color:#8B0000;border:1px solid rgba(184,0,0,0.3)}

<body>
<div id="root"></div>
<script>
const{useState,useEffect,useMemo,useRef}=React;
const SK='wt_yanlong_v2';
const DT=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const LOGO='/mnt/user-data/uploads/1777634985792_image.png';
const GSHEET='https://script.google.com/macros/s/AKfycbx3kYa6cIMWQbkEH6tgYgJfnOXusfIbfxCffMx1Q-AaGWV7gcKww3XkQNw9QGfqaSbW/exec';

const load=()=>{try{const d=localStorage.getItem(SK);return d?JSON.parse(d):null}catch{return null}};
const sv=d=>{try{localStorage.setItem(SK,JSON.stringify(d))}catch{}};

const init=()=>({
  employees:[
    {id:'adm001',name:'เจ้าของ',department:'บริหาร',role:'admin',pin:'0000',startDate:'2010-01-01',birthday:'1975-04-15',weeklyOff:[0],bdayMsg:'สุขสันต์วันเกิดเจ้านาย!',salary:0,bankName:'',bankAccount:''},
    {id:'emp001',name:'สมชาย ใจดี',department:'รับจำนำ',role:'employee',pin:'1234',startDate:'2022-03-15',birthday:'2000-05-02',weeklyOff:[0,6],bdayMsg:'สุขสันต์วันเกิดค่ะ!',salary:18000,bankName:'กสิกรไทย',bankAccount:'123-4-56789-0'},
    {id:'emp002',name:'สุดา มานะ',department:'บัญชี',role:'employee',pin:'5678',startDate:'2023-07-01',birthday:'1995-04-30',weeklyOff:[0],bdayMsg:'Happy Birthday!',salary:16000,bankName:'ไทยพาณิชย์',bankAccount:'456-7-89012-3'},
  ],
  records:[],leaves:[],
  settings:{
    onTimeHour:8,onTimeMin:30,lateHour:9,lateMin:0,
    bdayAdminMsg:'ใกล้วันเกิดของ {name} อีก {days} วัน',
    leaveTypes:[{name:'ลาพักร้อน',quota:10},{name:'ลาป่วย',quota:30},{name:'ลากิจ',quota:3}],
    locations:[{id:'loc1',name:'สำนักงานใหญ่ ย่งล้ง',lat:13.8,lng:100.5,radius:500,mapUrl:'https://maps.google.com/?q=13.8,100.5'}],
    holidays:['2026-01-01','2026-04-13','2026-04-14','2026-04-15','2026-12-31'],
  }
});

const todayStr=()=>new Date().toISOString().slice(0,10);
const timeStr=()=>{const n=new Date();return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')};
const fmtD=(s)=>{if(!s)return'-';const d=new Date(s+'T00:00:00');return d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})};
const fmtS=(s)=>{if(!s)return'-';const d=new Date(s+'T00:00:00');return d.toLocaleDateString('th-TH',{day:'numeric',month:'short'})};
const moneyFmt=(n)=>Math.round(n).toLocaleString('th-TH');

function gdist(la1,lo1,la2,lo2){
  const R=6371000,dr=(la2-la1)*Math.PI/180,dl=(lo2-lo1)*Math.PI/180;
  const a=Math.sin(dr/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dl/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function bdayAlerts(emps){
  const t=new Date();const r=[];
  emps.forEach(e=>{
    if(!e.birthday)return;
    const bMD=e.birthday.slice(5);
    const bd=new Date(t.getFullYear(),parseInt(bMD.slice(0,2))-1,parseInt(bMD.slice(3)));
    if(bd<t&&bd.toDateString()!==t.toDateString())bd.setFullYear(t.getFullYear()+1);
    const diff=Math.round((bd-t)/86400000);
    if(diff===0)r.push({emp:e,diff:0,type:'today'});
    else if(diff>0&&diff<=3)r.push({emp:e,diff,type:'soon'});
  });
  return r;
}
function isBdayToday(emp){
  if(!emp?.birthday)return false;
  const t=new Date();
  return String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')===emp.birthday.slice(5);
}

async function sendGS(action,data){
  if(!GSHEET)return{ok:false};
  try{
    const res=await fetch(GSHEET,{
      method:'POST',mode:'no-cors',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action,data})
    });
    return{ok:true};
  }catch(e){return{ok:false,err:e.message}}
}

function CatPopup({time,location,name,gsStatus,onClose}){
  const cats=['😸','🐱','😺','🐈','😻'];
  const cat=cats[Math.floor(Math.random()*cats.length)];
  return React.createElement('div',{className:'cat-overlay',onClick:onClose},
    React.createElement('div',{className:'cat-box',onClick:e=>e.stopPropagation()},
      React.createElement('span',{className:'cat-emoji'},cat),
      React.createElement('div',{className:'cat-stars'},'✨ ⭐ ✨ ⭐ ✨'),
      React.createElement('div',{className:'cat-msg'},'เย้! บันทึกเวลาสำเร็จ!'),
      React.createElement('div',{style:{fontSize:'14px',color:'var(--text3)',margin:'4px 0'}},`⏰ ${time} น.`),
      React.createElement('div',{style:{fontSize:'12px',color:'var(--gold)',marginBottom:'6px'}},`📍 ${location}`),
      React.createElement('div',{style:{fontSize:'12px',marginBottom:'4px'}},
        gsStatus==='sending'?React.createElement('span',{className:'gs-badge gs-wait'},'⏳ กำลังส่ง Google Sheets...'):
        gsStatus==='ok'?React.createElement('span',{className:'gs-badge gs-ok'},'✓ บันทึกลง Google Sheets แล้ว'):
        React.createElement('span',{className:'gs-badge gs-err'},'⚠ ส่ง Sheet ไม่ได้ (บันทึกในเครื่องแล้ว)')
      ),
      React.createElement('div',{style:{fontSize:'11.5px',color:'#aaa',marginTop:'4px'}},`สู้ๆ นะ ${name}! 🐾`),
      React.createElement('button',{className:'cat-close-btn',onClick:onClose},'ปิด 🐾')
    )
  );
}

function App(){
  const stored=load();
  const[data,setData]=useState(stored||init());
  const[view,setView]=useState('checkin');
  const[user,setUser]=useState(null);
  const[now,setNow]=useState(new Date());
  const[al,setAl]=useState(null);
  const[catPop,setCatPop]=useState(null);

  useEffect(()=>{const t=setInterval(()=>setNow(new Date()),1000);return()=>clearInterval(t)},[]);
  useEffect(()=>{sv(data)},[data]);

  const showAl=(msg,type='i',dur=3500)=>{setAl({msg,type});setTimeout(()=>setAl(null),dur)};
  const upd=u=>setData(d=>({...d,...u}));
  const role=user?.role||'guest';
  const{employees,records,leaves,settings}=data;

  const getStatus=(empId,dateStr)=>{
    const emp=employees.find(e=>e.id===empId);
    const lv=leaves.find(l=>l.empId===empId&&l.status==='approved'&&dateStr>=l.startDate&&dateStr<=l.endDate);
    if(lv)return{status:'leave',label:'ลา',bx:'bx-p'};
    const rec=records.filter(r=>r.empId===empId&&r.date===dateStr);
    if(rec.length>0)return{status:'present',label:'มาทำงาน',bx:'bx-g'};
    const d=new Date(dateStr+'T00:00:00');
    const dow=d.getDay();
    if(emp?.weeklyOff?.includes(dow))return{status:'weekly_off',label:'หยุดประจำสัปดาห์',bx:'bx-gr'};
    if(settings.holidays.includes(dateStr))return{status:'holiday',label:'หยุดนักขัตฤกษ์',bx:'bx-gr'};
    if(dateStr>todayStr())return{status:'future',label:'-',bx:'bx-gr'};
    return{status:'absent',label:'ขาดงาน',bx:'bx-r'};
  };
  const getTStat=(t)=>{
    if(!t)return null;
    const[h,m]=t.split(':').map(Number);
    const{onTimeHour:oH,onTimeMin:oM,lateHour:lH,lateMin:lM}=settings;
    if(h<oH||(h===oH&&m<=oM))return{label:'ตรงเวลา',bx:'bx-g'};
    if(h<lH||(h===lH&&m<=lM))return{label:'เกือบสาย',bx:'bx-a'};
    return{label:'สาย',bx:'bx-r'};
  };
  const getLeaveUsed=(empId,yr,tp)=>leaves.filter(l=>l.empId===empId&&l.status==='approved'&&l.startDate.startsWith(yr)&&(!tp||l.leaveType===tp)).reduce((s,l)=>s+Math.round((new Date(l.endDate)-new Date(l.startDate))/86400000)+1,0);
  const bdays=useMemo(()=>bdayAlerts(employees),[employees]);
  const isBday=isBdayToday(user);

  const navItems=[
    {key:'checkin',label:'บันทึกเวลา',icon:'⏰'},
    role==='admin'&&{key:'employees',label:'พนักงาน',icon:'👥'},
